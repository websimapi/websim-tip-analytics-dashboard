<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Analytics Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "marked": "https://cdn.jsdelivr.net/npm/marked/lib/marked.esm.js",
            "dompurify": "https://cdn.jsdelivr.org/npm/dompurify/dist/purify.es.min.js"
        }
    }
    </script>
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Tip Analytics Dashboard</h1>
            <p class="subtitle">Track all tips and support received for this project</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">💎</div>
                <div class="stat-value" id="total-tips">0</div>
                <div class="stat-label">Total Tips</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <div class="stat-value" id="total-credits">0</div>
                <div class="stat-label">Total Credits</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="unique-tippers">0</div>
                <div class="stat-label">Unique Tippers</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-value" id="avg-tip">0</div>
                <div class="stat-label">Avg Tip Size</div>
            </div>
        </div>

        <div class="controls">
            <button id="refresh-btn" class="btn primary">
                <span>🔄 Refresh Data</span>
            </button>
            <button id="export-btn" class="btn secondary">
                <span>📊 Export CSV</span>
            </button>
        </div>

        <div class="filter-section">
            <label>
                <input type="checkbox" id="show-images" checked>
                Show Images
            </label>
        </div>

        <div class="tips-container">
            <h2>Recent Tips</h2>
            <div id="tips-list" class="tips-list">
                <div class="loading">Loading tips...</div>
            </div>
            <button id="load-more" class="btn secondary" style="display: none;">
                Load More
            </button>
        </div>

        <div class="user-stats">
            <h2>Top Contributors</h2>
            <div id="top-tippers" class="top-tippers"></div>
        </div>
    </div>

    <script type="module" src="app.js"></script>

</body>
</html>
